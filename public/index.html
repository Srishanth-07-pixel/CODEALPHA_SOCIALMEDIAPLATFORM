<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo — Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ══════════════════════════════════════════════════ AUTH SCREEN ══ -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">◈</span>
      <h1>Echo</h1>
      <p class="tagline">Where your voice resonates</p>
    </div>

    <!-- Login -->
    <div id="login-form" class="auth-form active">
      <h2>Welcome back</h2>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" />
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <div id="login-error" class="form-error hidden"></div>
      <button class="btn-primary" onclick="handleLogin()">Sign In</button>
      <p class="auth-switch">New here? <span onclick="switchAuth('register')">Create account</span></p>
    </div>

    <!-- Register -->
    <div id="register-form" class="auth-form">
      <h2>Join Echo</h2>
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="yourhandle" />
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" />
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min 6 characters" />
      </div>
      <div id="register-error" class="form-error hidden"></div>
      <button class="btn-primary" onclick="handleRegister()">Create Account</button>
      <p class="auth-switch">Already have one? <span onclick="switchAuth('login')">Sign in</span></p>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════ MAIN APP ══════ -->
<div id="app" class="app hidden">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">◈</span>
      <span>Echo</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-btn active" data-page="feed" onclick="navigate('feed')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        <span>Feed</span>
      </button>
      <button class="nav-btn" data-page="explore" onclick="navigate('explore')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <span>Explore</span>
      </button>
      <button class="nav-btn" data-page="profile" onclick="navigate('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </button>
    </nav>

    <button class="nav-btn logout-btn" onclick="handleLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Logout</span>
    </button>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- ── FEED PAGE ───────────────────────────────────── -->
    <section id="page-feed" class="page active">
      <div class="page-header">
        <h2>Feed</h2>
        <div class="feed-tabs">
          <button class="tab-btn active" onclick="switchFeed('following')">Following</button>
          <button class="tab-btn" onclick="switchFeed('all')">All Posts</button>
        </div>
      </div>

      <!-- Create post -->
      <div class="create-post-card">
        <div class="create-post-top">
          <div id="feed-avatar" class="avatar-sm"></div>
          <textarea id="post-content" placeholder="What's echoing in your mind?" rows="2"></textarea>
        </div>
        <div class="create-post-actions">
          <label class="img-upload-label" for="post-image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Photo
          </label>
          <input type="file" id="post-image" accept="image/*" hidden onchange="previewImage(this)" />
          <button class="btn-post" onclick="createPost()">Post</button>
        </div>
        <div id="image-preview" class="image-preview hidden">
          <img id="preview-img" src="" alt="" />
          <button class="remove-img" onclick="removeImage()">✕</button>
        </div>
      </div>

      <div id="feed-posts" class="posts-list">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </section>

    <!-- ── EXPLORE PAGE ──────────────────────────────────── -->
    <section id="page-explore" class="page">
      <div class="page-header">
        <h2>Explore</h2>
      </div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Search users…" oninput="searchUsers()" />
      </div>
      <div id="search-results" class="user-list"></div>
      <div id="explore-posts" class="posts-list"></div>
    </section>

    <!-- ── PROFILE PAGE ──────────────────────────────────── -->
    <section id="page-profile" class="page">
      <div id="profile-content"></div>
    </section>

  </main>

  <!-- Right Panel -->
  <aside class="right-panel">
    <div class="who-to-follow">
      <h3>Suggested Users</h3>
      <div id="suggested-users"></div>
    </div>
  </aside>
</div>

<!-- ══════════════════════════════════════════════ POST MODAL ══════── -->
<div id="post-modal" class="modal-overlay hidden" onclick="closeModal(event)">
  <div class="modal-card">
    <button class="modal-close" onclick="closePostModal()">✕</button>
    <div id="modal-post-content"></div>
    <div class="comments-section">
      <h4>Comments</h4>
      <div id="modal-comments" class="comments-list"></div>
      <div class="comment-input-row">
        <input type="text" id="comment-input" placeholder="Add a comment…" />
        <button onclick="submitComment()">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
